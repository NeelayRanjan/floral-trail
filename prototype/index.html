<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floral Trail</title>
  <style>
    :root {
      --panel-bg: rgba(250, 248, 244, 0.9);
      --panel-fg: #222;
      --panel-line: rgba(0, 0, 0, 0.12);
      --accent: #6a4f2a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --panel-bg: rgba(28, 26, 24, 0.9); --panel-fg: #eee; --panel-line: rgba(255, 255, 255, 0.14); }
    }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #f6f1e8; font: 12px/1.3 system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; display: block; }
    .hero { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; color: #2a2520; }
    .hero h1 { font: 400 clamp(36px, 7vw, 96px)/1 Georgia, serif; margin: 0; letter-spacing: 0.02em; }
    .hero p { opacity: 0.6; font-size: 14px; }
    #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 10; color: var(--panel-fg); }
    #panel .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 10px; background: var(--panel-bg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--panel-line); }
    #panel.collapsed .bar > :not(.collapse) { display: none; }
    #panel.collapsed .bar { background: transparent; border: 0; backdrop-filter: none; }
    #panel button, #panel select, #panel input[type=number] { font: inherit; padding: 2px 6px; }
    #panel .seed { width: 70px; }
    #panel .fps { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.7; }
    #panel .groups { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; position: relative; }
    #panel details > summary { cursor: pointer; padding: 2px 8px; border: 1px solid var(--panel-line); border-radius: 4px; list-style: none; }
    #panel details > summary::-webkit-details-marker { display: none; }
    #panel details[open] > summary { background: var(--accent); color: #fff; }
    #panel .controls { position: absolute; left: 0; right: 0; top: calc(100% + 6px); display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; padding: 10px; max-height: 60vh; overflow: auto; background: var(--panel-bg); backdrop-filter: blur(8px); border: 1px solid var(--panel-line); border-radius: 6px; }
    #panel .control { display: grid; grid-template-columns: 1fr 52px; align-items: center; gap: 2px 6px; }
    #panel .control .name { grid-column: 1 / -1; }
    #panel .control output { text-align: right; font-variant-numeric: tabular-nums; }
    #panel .tag { margin-left: 6px; font-size: 10px; padding: 0 4px; border-radius: 3px; background: var(--panel-line); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <main class="hero">
    <h1>Floral Trail</h1>
    <p>move your cursor</p>
  </main>
  <div id="panel"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
